<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101216">
  <title>Payment status | Test Store</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/payment-result.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/">TEST STORE <span>/ PAYMENT</span></a>
    <span class="environment-tag">TEST MODE</span>
  </header>
  <main class="verify-layout">
    <section class="auth-panel">
      <h1 id="result-heading">Checking your payment.</h1>
      <p class="record-code">RECORD 001 <span>/</span> PAYMENT STATUS</p>
      <p id="result-copy" class="panel-note" role="status" aria-live="polite">Stripe is confirming the test payment.</p>
      <div id="result-amount" class="result-amount"></div>
      <a class="primary-button button-link" href="/">RETURN TO PRODUCTS</a>
    </section>
  </main>
</body>
</html>
