<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101216">
  <title>Confirm your email | Test Store</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/verify.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="wordmark" href="/">TEST STORE <span>/ RECORDS</span></a>
    <span class="environment-tag">ACCOUNT CONFIRMATION</span>
  </header>
  <main class="verify-layout">
    <section class="auth-panel">
      <h1>Confirm your email.</h1>
      <p class="record-code">ACCOUNT <span>/</span> 00-01</p>
      <p class="panel-note">Confirm the address you used to create your account. This link can be used once.</p>
      <button id="verify-button" class="primary-button" type="button">CONFIRM EMAIL</button>
      <div id="verify-message" class="notice" role="status" aria-live="polite" hidden></div>
      <a class="inline-link" href="/">Return to sign in</a>
    </section>
  </main>
</body>
</html>
